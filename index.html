<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 16px이하 자동 확대 방지 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png?v=2"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=2"
    />
    <meta name="apple-mobile-web-app-title" content="북메이트" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="북메이트" />
    <meta property="og:site_name" content="북메이트" />
    <meta
      property="og:description"
      content="아이들의 독서 생활을 함께 나누는 공간"
    />
    <meta property="og:image" content="%VITE_DOMAIN_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="%VITE_DOMAIN_URL%" />

    <!-- SEO -->
    <title>북메이트</title>
    <meta name="description" content="아이들의 독서 생활을 함께 나누는 공간" />
  </head>

  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
