<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 라이트 모드만 지원 -->
    <meta name="color-scheme" content="light" />
    <!-- 16px이하 자동 확대 방지 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png?v=2"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=2"
    />
    <meta name="apple-mobile-web-app-title" content="북메이트" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="북메이트" />
    <meta property="og:site_name" content="북메이트" />
    <meta
      property="og:description"
      content="아이들의 독서 생활을 함께 나누는 공간"
    />
    <meta property="og:image" content="%VITE_DOMAIN_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="%VITE_DOMAIN_URL%" />

    <!-- SEO -->
    <title>북메이트</title>
    <meta name="description" content="아이들의 독서 생활을 함께 나누는 공간" />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 16px;

        background: #fff;
        opacity: 1;
        visibility: visible;

        transition:
          opacity 0.25s ease,
          visibility 0s linear 0s;
      }

      /* 로딩 종료 */
      #initial-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition:
          opacity 0.25s ease,
          visibility 0s linear 0.25s;
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader {
          transition: none;
        }

        #initial-loader.hidden {
          transition: none;
        }
      }

      /* 점 3개 로딩 */
      .loading-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 24px;
      }

      .loading-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #9ca3af;
        animation: dot-bounce 1.2s ease-in-out infinite;
      }

      .loading-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .loading-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes dot-bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.35;
        }

        30% {
          transform: translateY(-6px);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-dots span {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="modal-root"></div>

    <!-- 초기 로딩 -->
    <div id="initial-loader" role="status" aria-label="로딩 중">
      <img id="loading-image" alt="" width="144" height="144" />

      <div class="loading-dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <script>
      const index = Math.floor(Math.random() * 4) + 1;
      document.getElementById("loading-image").src =
        `/loading/loading-${index}.webp`;
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
